{% extends 'student/base.html' %}
{% block title %}成绩查询 - 校园综合管理系统{% endblock %}
{% block content %}
<!-- 统计卡片 -->
<div class="layui-row layui-col-space15" style="margin-bottom: 20px;">
    <div class="layui-col-md3">
        <div class="stat-card stat-card-cyan">
            <div class="stat-icon">
                <i class="layui-icon layui-icon-chart"></i>
            </div>
            <div class="stat-content">
                <div class="stat-number" id="total-courses">0</div>
                <div class="stat-label">总课程数</div>
            </div>
        </div>
    </div>
    <div class="layui-col-md3">
        <div class="stat-card stat-card-orange">
            <div class="stat-icon">
                <i class="layui-icon layui-icon-ok-circle"></i>
            </div>
            <div class="stat-content">
                <div class="stat-number" id="avg-score">0.0</div>
                <div class="stat-label">平均分</div>
            </div>
        </div>
    </div>
    <div class="layui-col-md3">
        <div class="stat-card stat-card-purple">
            <div class="stat-icon">
                <i class="layui-icon layui-icon-star"></i>
            </div>
            <div class="stat-content">
                <div class="stat-number" id="excellent-count">0</div>
                <div class="stat-label">优秀课程</div>
            </div>
        </div>
    </div>
    <div class="layui-col-md3">
        <div class="stat-card stat-card-blue">
            <div class="stat-icon">
                <i class="layui-icon layui-icon-close"></i>
            </div>
            <div class="stat-content">
                <div class="stat-number" id="fail-count">0</div>
                <div class="stat-label">挂科课程</div>
            </div>
        </div>
    </div>
</div>

<!-- 成绩表格 -->
<div class="layui-card">
    <div class="layui-card-header">
        <div class="card-header-content">
            <div class="header-title">
                <i class="layui-icon layui-icon-chart"></i>
                <span>我的成绩单</span>
            </div>
        </div>
    </div>
    <div class="layui-card-body">
        <div class="table-container">
            <table class="layui-table" id="grades-table">
                <thead>
                    <tr>
                        <th>课程代码</th>
                        <th>课程名称</th>
                        <th>课程类型</th>
                        <th>学分</th>
                        <th>授课教师</th>
                        <th>成绩</th>
                        <th>等级</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="8" class="loading-row">
                            <div class="loading-content">
                                <i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i>
                                <span>加载中...</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<style>
.stat-card {
    border-radius: 16px;
    padding: 18px 20px;
    color: #222;
    display: flex;
    align-items: center;
    box-shadow: 0 2px 12px rgba(22,186,170,0.08);
    background: rgba(255,255,255,0.7);
    margin-bottom: 0;
    transition: box-shadow 0.3s;
}
.stat-card-cyan { background: rgba(22,186,170,0.13); }
.stat-card-orange { background: rgba(250,173,20,0.13); }
.stat-card-purple { background: rgba(121,40,202,0.10); }
.stat-card-blue { background: rgba(24,144,255,0.13); }
.stat-icon {
    font-size: 30px;
    margin-right: 14px;
    opacity: 0.7;
}
.stat-number {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 2px;
    color: #222;
}
.stat-label {
    font-size: 12px;
    color: #888;
    opacity: 0.8;
    font-weight: 400;
}
.card-header-content { display: flex; justify-content: space-between; align-items: center; }
.header-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; }
.header-title i { color: #16baaa; }
.table-container { overflow-x: auto; }
.layui-table { border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.layui-table thead tr { background: linear-gradient(135deg, #16baaa 0%, #0ea5a5 100%); color: white; }
.layui-table thead th { font-weight: 500; padding: 15px 12px; border: none; }
.layui-table tbody tr:hover { background-color: #f8f9fa; }
.layui-table tbody td { padding: 12px; border-bottom: 1px solid #f0f0f0; }
.loading-row { text-align: center; padding: 40px 0; }
.loading-content { display: flex; align-items: center; justify-content: center; gap: 10px; color: #999; }
.score-cell { font-weight: bold; font-size: 16px; }
.score-excellent { color: #52c41a; background: rgba(82, 196, 26, 0.1); padding: 4px 12px; border-radius: 6px; border: 1px solid rgba(82, 196, 26, 0.3); }
.score-good { color: #1890ff; background: rgba(24, 144, 255, 0.1); padding: 4px 12px; border-radius: 6px; border: 1px solid rgba(24, 144, 255, 0.3); }
.score-pass { color: #faad14; background: rgba(250, 173, 20, 0.1); padding: 4px 12px; border-radius: 6px; border: 1px solid rgba(250, 173, 20, 0.3); }
.score-fail { color: #f5222d; background: rgba(245, 34, 45, 0.1); padding: 4px 12px; border-radius: 6px; border: 1px solid rgba(245, 34, 45, 0.3); }
.grade-badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; text-align: center; min-width: 40px; }
.grade-a { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
.grade-b { background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; }
.grade-c { background: #fff7e6; color: #faad14; border: 1px solid #ffd591; }
.grade-d { background: #fff2f0; color: #f5222d; border: 1px solid #ffccc7; }
.status-badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.status-completed { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
.status-pending { background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; }
.empty-state { text-align: center; padding: 60px 20px; color: #999; }
.empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
.empty-state .empty-text { font-size: 14px; margin-bottom: 8px; }
.empty-state .empty-subtext { font-size: 12px; opacity: 0.7; }
</style>
{% endblock %}

{% block custom_js %}
<script>
layui.use(['jquery', 'layer'], function(){
    var $ = layui.$;
    var layer = layui.layer;
    
    function getAuthHeaders() {
        const token = localStorage.getItem('jwt_token');
        return {
            'Content-Type': 'application/json',
            'Authorization': token ? 'Bearer ' + token : ''
        };
    }
    
    function updateStats(grades) {
        const totalCourses = grades.length;
        const scoredGrades = grades.filter(g => g.score != null);
        const avgScore = scoredGrades.length > 0 
            ? (scoredGrades.reduce((sum, g) => sum + g.score, 0) / scoredGrades.length).toFixed(1)
            : '0.0';
        const excellentCount = scoredGrades.filter(g => g.score >= 90).length;
        const failCount = scoredGrades.filter(g => g.score < 60).length;
        
        $('#total-courses').text(totalCourses);
        $('#avg-score').text(avgScore);
        $('#excellent-count').text(excellentCount);
        $('#fail-count').text(failCount);
    }
    
    function getScoreClass(score) {
        if (score === null || score === undefined) return '';
        if (score >= 90) return 'score-excellent';
        if (score >= 80) return 'score-good';
        if (score >= 60) return 'score-pass';
        return 'score-fail';
    }
    
    function getGradeBadge(score) {
        if (score === null || score === undefined) return '';
        if (score >= 90) return '<span class="grade-badge grade-a">A</span>';
        if (score >= 80) return '<span class="grade-badge grade-b">B</span>';
        if (score >= 70) return '<span class="grade-badge grade-c">C</span>';
        if (score >= 60) return '<span class="grade-badge grade-c">D</span>';
        return '<span class="grade-badge grade-d">F</span>';
    }
    
    function getStatusBadge(score) {
        if (score === null || score === undefined) {
            return '<span class="status-badge status-pending">待公布</span>';
        }
        return '<span class="status-badge status-completed">已公布</span>';
    }
    
    function loadGrades() {
        $.ajax({
            url: '/student/api/grades',
            type: 'GET',
            headers: getAuthHeaders(),
            dataType: 'json',
            success: function(res) {
                if(res.code === 0) {
                    const grades = res.data || [];
                    updateStats(grades);
                    
                    if (grades.length === 0) {
                        $('#grades-table tbody').html(`
                            <tr>
                                <td colspan="8" class="empty-state">
                                    <i class="layui-icon layui-icon-face-cry"></i>
                                    <div class="empty-text">暂无成绩记录</div>
                                    <div class="empty-subtext">请等待成绩公布或联系教务老师</div>
                                </td>
                            </tr>
                        `);
                        return;
                    }
                    
                    var html = '';
                    grades.forEach(function(g){
                        const scoreClass = getScoreClass(g.score);
                        const gradeBadge = getGradeBadge(g.score);
                        const statusBadge = getStatusBadge(g.score);
                        const scoreDisplay = g.score != null ? g.score : '-';
                        
                        html += '<tr>' +
                            '<td><strong>' + (g.course_id || '-') + '</strong></td>' +
                            '<td>' + (g.course_name || '-') + '</td>' +
                            '<td>' + (g.course_type || '-') + '</td>' +
                            '<td>' + (g.credits || '-') + '</td>' +
                            '<td>' + (g.teacher_name || '-') + '</td>' +
                            '<td class="score-cell ' + scoreClass + '">' + scoreDisplay + '</td>' +
                            '<td>' + gradeBadge + '</td>' +
                            '<td>' + statusBadge + '</td>' +
                            '</tr>';
                    });
                    $('#grades-table tbody').html(html);
                } else {
                    $('#grades-table tbody').html(`
                        <tr>
                            <td colspan="8" class="empty-state">
                                <i class="layui-icon layui-icon-face-cry"></i>
                                <div class="empty-text">加载失败</div>
                                <div class="empty-subtext">${res.msg || '请稍后重试'}</div>
                            </td>
                        </tr>
                    `);
                }
            },
            error: function() {
                $('#grades-table tbody').html(`
                    <tr>
                        <td colspan="8" class="empty-state">
                            <i class="layui-icon layui-icon-face-cry"></i>
                            <div class="empty-text">网络错误</div>
                            <div class="empty-subtext">请检查网络连接后重试</div>
                        </td>
                    </tr>
                `);
            }
        });
    }
    
    window.refreshGrades = function() {
        loadGrades();
        layer.msg('刷新成功', {icon: 1});
    };
    
    $(function(){ 
        loadGrades(); 
    });
});
</script>
{% endblock %}
