<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园管理系统 - 登录</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* 小清新登录专用样式 */
        body.login-bg {
            min-height: 100vh;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .login-bg::before {
            content: '';
            position: absolute;
            top: -120px;
            left: -80px;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, #c2e9fb 60%, transparent 100%);
            z-index: 0;
            opacity: 0.5;
        }
        .login-bg::after {
            content: '';
            position: absolute;
            bottom: -100px;
            right: -60px;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, #fcb69f 60%, transparent 100%);
            z-index: 0;
            opacity: 0.4;
        }
        .login-card {
            position: relative;
            z-index: 1;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(168, 237, 234, 0.18);
            padding: 48px 36px 32px 36px;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .login-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            box-shadow: 0 8px 32px rgba(168, 237, 234, 0.18);
            background: #fff;
            margin-bottom: 18px;
            object-fit: cover;
        }
        .login-title {
            font-size: 2.1rem;
            font-weight: bold;
            color: #4f9da6;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px #c2e9fb;
        }
        .login-subtitle {
            font-size: 1.1rem;
            color: #a1c4fd;
            margin-bottom: 28px;
            letter-spacing: 1px;
        }
        .login-form {
            width: 100%;
        }
        .login-input {
            width: 100%;
            height: 48px;
            background: rgba(255,255,255,0.98);
            border: 2px solid #a1c4fd;
            border-radius: 24px;
            padding: 0 20px;
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 20px;
            box-sizing: border-box;
            transition: border 0.3s, box-shadow 0.3s;
            box-shadow: 0 2px 12px rgba(161, 196, 253, 0.10);
        }
        .login-input:focus {
            border: 2px solid #4f9da6;
            box-shadow: 0 4px 24px rgba(79, 157, 166, 0.13);
            outline: none;
        }
        .login-btn {
            width: 100%;
            height: 48px;
            background: linear-gradient(90deg, #a1c4fd 0%, #c2e9fb 100%);
            border: none;
            border-radius: 24px;
            color: #4f9da6;
            font-size: 1.2rem;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(161, 196, 253, 0.13);
            margin-top: 8px;
            letter-spacing: 2px;
            transition: background 0.3s, transform 0.1s;
            cursor: pointer;
        }
        .login-btn:active {
            background: linear-gradient(90deg, #c2e9fb 0%, #a1c4fd 100%);
            transform: scale(0.97);
        }
        .login-footer {
            margin-top: 24px;
            font-size: 0.95rem;
            color: #b2bec3;
            text-align: center;
        }
    </style>
</head>
<body class="login-bg">
    <div class="login-card">
        <img src="/static/images/logo.png" alt="logo" class="login-logo" onerror="this.style.display='none'">
        <div class="login-title">校园管理系统</div>
        <div class="login-subtitle">Web端登录</div>
        <form class="login-form" id="loginForm">
            <input type="text" id="username" name="username" class="login-input" placeholder="请输入用户名" required>
            <input type="password" id="password" name="password" class="login-input" placeholder="请输入密码" required>
            <button type="submit" class="login-btn">登录</button>
        </form>
        <div class="login-footer">登录即表示同意《用户协议》和《隐私政策》</div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const username = usernameInput.value;
                const password = passwordInput.value;
                // 这里可根据实际情况添加loading和消息提示
                try {
                    const response = await fetch('{{ url_for("auth.login") }}', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ username, password }),
                    });
                    if (response.ok) {
                        const data = await response.json();
                        if (data.access_token) {
                            localStorage.setItem('jwt_token', data.access_token);
                        }
                        // 跳转逻辑
                        if (data.user && data.user.role === 'Admin') {
                            window.location.href = '/admin/dashboard';
                        } else if (data.user && data.user.role === 'Student') {
                            window.location.href = '/student/profile';
                        } else if (data.user && data.user.role === 'Teacher') {
                            window.location.href = '/teacher/dashboard';
                        } else {
                            window.location.href = '/';
                        }
                    } else {
                        alert('登录失败，请检查用户名或密码。');
                    }
                } catch (error) {
                    alert('网络请求失败，请稍后再试。');
                }
            });
        });
    </script>
</body>
</html>
